name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Ogni mattina (04:17 UTC) il sito si ricostruisce con voto e recensioni Google aggiornati
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Voto e recensioni Google dal gestionale; se non risponde resta il file committato
      - run: npm run fetch-reviews
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
